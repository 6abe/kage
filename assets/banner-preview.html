<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kage banner type</title>
  <style>
    :root {
      --cyan: #7ec8ff;
      --mute: #8aa4b8;
      --title: #e8f4ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #0b1116;
      color: #d7e2ea;
      font: 14px/1.4 ui-sans-serif, system-ui, "Noto Sans CJK JP", sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      padding: 16px 20px;
    }
    header p { margin: 0; color: #8aa4b8; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      background: #1a242c;
      color: inherit;
      border: 1px solid #2c3a44;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
    label { color: #8aa4b8; }
    input[type="color"] { width: 36px; height: 28px; padding: 0; border: 0; background: none; }
    input[type="range"] { width: 140px; }
    .stage-wrap { padding: 0 20px 24px; }
    .stage {
      position: relative;
      width: min(1280px, 100%);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 4px;
    }
    .stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .box {
      position: absolute;
      display: flex;
      align-items: stretch;
      max-width: 48%;
      cursor: grab;
    }
    .box:active { cursor: grabbing; }
    .box.selected { z-index: 2; }
    .handle {
      width: 14px;
      flex: 0 0 14px;
      margin-right: 6px;
      border-radius: 3px;
      background:
        radial-gradient(circle, #7ec8ff 1.2px, transparent 1.4px) 4px 30% / 6px 6px repeat-y,
        radial-gradient(circle, #7ec8ff 1.2px, transparent 1.4px) 8px 30% / 6px 6px repeat-y;
      background-color: #7ec8ff22;
      opacity: 0.35;
    }
    .box:hover .handle,
    .box.selected .handle { opacity: 1; }
    .box.selected .copy {
      outline: 1px dashed #7ec8ff99;
      outline-offset: 4px;
    }
    .copy {
      margin: 0;
      min-width: 2ch;
      outline: 1px dashed transparent;
    }
    .copy:focus { outline: 1px solid #7ec8ffaa; outline-offset: 4px; }
    .kicker .copy {
      font-size: clamp(11px, 1.15vw, 15px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 500;
    }
    .rule-box .copy {
      width: 2.4em;
      height: 2px;
      background: var(--cyan);
      min-width: 2.4em;
    }
    .title .copy {
      font-size: var(--title-size, 84px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--cyan);
    }
    .tag .copy {
      font-size: clamp(16px, 2.1vw, 28px);
      font-weight: 400;
      color: var(--title);
      line-height: 1.25;
    }
    .meta .copy {
      font-size: clamp(11px, 1.15vw, 15px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mute);
    }
  </style>
</head>
<body>
  <header>
    <p>Drag the dotted handle to move a box. Click the words to edit. Double-click a box to type.</p>
    <div class="row">
      <button type="button" id="btn-kage" aria-pressed="true">kage.jpg</button>
      <button type="button" id="btn-kage01" aria-pressed="false">kage01.jpg</button>
    </div>
    <div class="row">
      <label>Title <input type="color" id="title-color" value="#7ec8ff"></label>
      <label>Size <input type="range" id="title-size" min="40" max="110" value="84"></label>
    </div>
  </header>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <img id="plate" src="kage.jpg" alt="">
      <div class="box kicker" style="left:6%;top:22%">
        <div class="handle"></div>
        <p class="copy" contenteditable="true">Hyprland</p>
      </div>
      <div class="box rule-box" style="left:6%;top:28%">
        <div class="handle"></div>
        <div class="copy"></div>
      </div>
      <div class="box title" style="left:6%;top:32%">
        <div class="handle"></div>
        <h1 class="copy" contenteditable="true">Kage</h1>
      </div>
      <div class="box tag" style="left:6%;top:52%">
        <div class="handle"></div>
        <p class="copy" contenteditable="true">Observe first.<br>Act when allowed.</p>
      </div>
      <div class="box meta" style="left:6%;top:72%">
        <div class="handle"></div>
        <p class="copy" contenteditable="true">See · Click · Type</p>
      </div>
    </div>
  </div>
  <script>
    const stage = document.getElementById("stage");
    const plate = document.getElementById("plate");
    const btnKage = document.getElementById("btn-kage");
    const btnKage01 = document.getElementById("btn-kage01");

    function setPlate(name, active) {
      plate.src = name;
      btnKage.setAttribute("aria-pressed", active === "kage");
      btnKage01.setAttribute("aria-pressed", active === "kage01");
    }
    btnKage.onclick = () => setPlate("kage.jpg", "kage");
    btnKage01.onclick = () => setPlate("kage01.jpg", "kage01");
    document.getElementById("title-color").oninput = (e) => {
      document.documentElement.style.setProperty("--cyan", e.target.value);
    };
    document.getElementById("title-size").oninput = (e) => {
      document.documentElement.style.setProperty("--title-size", e.target.value + "px");
    };

    let drag = null;
    let selected = null;

    function select(box) {
      if (selected) selected.classList.remove("selected");
      selected = box;
      if (selected) selected.classList.add("selected");
    }

    stage.addEventListener("pointerdown", (e) => {
      const box = e.target.closest(".box");
      if (!box || !stage.contains(box)) {
        select(null);
        return;
      }
      select(box);
      const editing = e.target.closest("[contenteditable]") && document.activeElement === e.target;
      const fromHandle = e.target.classList.contains("handle");
      if (editing && !fromHandle) return;

      const r = box.getBoundingClientRect();
      const s = stage.getBoundingClientRect();
      drag = {
        box,
        dx: e.clientX - r.left,
        dy: e.clientY - r.top,
        s,
        moved: false,
      };
      box.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    stage.addEventListener("pointermove", (e) => {
      if (!drag) return;
      drag.moved = true;
      const x = ((e.clientX - drag.s.left - drag.dx) / drag.s.width) * 100;
      const y = ((e.clientY - drag.s.top - drag.dy) / drag.s.height) * 100;
      drag.box.style.left = Math.min(85, Math.max(0.5, x)) + "%";
      drag.box.style.top = Math.min(88, Math.max(0.5, y)) + "%";
    });

    stage.addEventListener("pointerup", () => { drag = null; });

    stage.addEventListener("dblclick", (e) => {
      const copy = e.target.closest(".box")?.querySelector("[contenteditable]");
      if (!copy) return;
      copy.focus();
      const range = document.createRange();
      range.selectNodeContents(copy);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
  </script>
</body>
</html>
